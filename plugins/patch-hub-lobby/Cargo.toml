[package]
name = "patch-hub-lobby"
version = "0.1.0"
edition = "2021"
description = "Pumpkin Patch hub lobby — server selector for Velocity networks"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
patch-network-protocol = { path = "../patch-network-protocol" }
pumpkin-plugin-api = { path = "../../../pumpkin/crates/pumpkin-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
