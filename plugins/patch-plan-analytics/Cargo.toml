[package]
name = "patch-plan-analytics"
version = "0.2.0"
edition = "2021"
description = "Patch Plan — Plan-inspired player analytics for Pumpkin (Pumpkin Patch bundled plugin)"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
patch-analytics-protocol = { path = "../patch-analytics-protocol" }
patch-plan-core = { path = "../../crates/patch-plan-core" }
# Must match the Pumpkin server binary (see repo `pumpkin/`). Re-run `npm run build:plugins` after API bumps.
pumpkin-plugin-api = { path = "../../pumpkin/crates/pumpkin-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pumpkin-hook-sdk = { path = "../../crates/pumpkin-hook-sdk" }
uuid = { version = "1", features = ["v4"] }
