name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core crates
        run: |
          cargo test -p patch-plan-core -p vineyard-protocol -p vineyard-bus -p gourd-proxy -p harvest-metrics -p patch-core -p patch-plugin-resolve -p velocity-bridge -p pumpkin-hook-sdk

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run frontend:build
