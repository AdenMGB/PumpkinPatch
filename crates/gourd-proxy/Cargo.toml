[package]
name = "gourd-proxy"
version = "0.1.0"
edition.workspace = true
description = "Gourd — Velocity-compatible Rust edge proxy core (plangem.md §1.3)"

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
