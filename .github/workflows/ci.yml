name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  patch-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-wasip2
      - run: cargo test -p patch-core
      - run: cargo build --release -p patch-hub-lobby --manifest-path plugins/patch-hub-lobby/Cargo.toml --target wasm32-wasip2
      - run: cargo build --release -p patch-plan-analytics --manifest-path plugins/patch-plan-analytics/Cargo.toml --target wasm32-wasip2

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run frontend:build
