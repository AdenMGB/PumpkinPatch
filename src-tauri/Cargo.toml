[package]
name = "pumpkin-patch"
version = "0.1.0"
description = "Pumpkin Patch desktop app"
authors = ["you"]
edition.workspace = true

[lib]
name = "pumpkin_patch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
patch-core = { path = "../crates/patch-core" }
patch-plan-http = { path = "../crates/patch-plan-http" }
vineyard-protocol = { path = "../crates/vineyard-protocol" }
velocity-bridge = { path = "../crates/velocity-bridge" }
patch-plugin-resolve = { path = "../crates/patch-plugin-resolve" }
crow-swarm = { path = "../crates/crow-swarm" }
patch-cas = { path = "../crates/patch-cas" }
patchwork = { path = "../crates/patchwork" }
tendril-voice = { path = "../crates/tendril-voice" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
