[workspace]
resolver = "2"
members = [
    "crates/patch-core",
    "plugins/patch-analytics-protocol",
    "plugins/patch-network-protocol",
    "src-tauri",
]

exclude = ["plugins/patch-plan-analytics", "plugins/patch-hub-lobby"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
