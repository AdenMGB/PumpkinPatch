[package]
name = "harvest-metrics"
version = "0.1.0"
edition.workspace = true
description = "HarvestMetrics OLAP mirror (JSON + optional DuckDB)"

[features]
default = []
duckdb-backend = ["dep:duckdb"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
duckdb = { version = "1.2", optional = true }
